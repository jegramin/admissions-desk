name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # package.json declares pnpm under devEngines, which this action doesn't
      # read, so the version is pinned here. Keep it within devEngines' range.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.11

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Supabase CLI is the pinned devDependency, run through pnpm, so CI
      # uses the lockfile's version. Not supabase/setup-cli: it runs npm inside
      # the repo, which devEngines rejects (EBADDEVENGINES).
      # Tests talk to Postgres only, so start just the database container
      # rather than the full stack. Ports (553xx) come from supabase/config.toml.
      - run: pnpm exec supabase db start

      - run: pnpm db:reset

      # No env vars or secrets: test/env.ts defaults to the local-only
      # credentials on the remapped ports, exactly as on a developer machine.
      - run: pnpm verify
